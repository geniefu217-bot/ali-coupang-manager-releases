name: Publish v1.1.18
on:
  push:
    paths:
      - '.github/workflows/publish-v1118.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-b8e4-8209-bcea-c8a6b3f84bb9/raw?se=2026-10-17T12%3A07%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=fba72783-1d51-49f9-98bd-a715e18be861&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T20%3A42%3A07Z&ske=2026-10-17T20%3A42%3A07Z&sks=b&skv=2026-02-06&sig=xyR%2BubVcjziFrIwto3iBQBFFzlmlxChQcsUF%2B6p4oVc%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.18.zip
          echo "b5e3cf3b89744dcf0c0d84bb2cfadf89a9601b5ada9dab3d9a31272a71d4da6d  AliCoupangManagerSetup-v1.1.18.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.18.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.18 AliCoupangManagerSetup-v1.1.18.zip --title "알리 쿠팡 매니저 v1.1.18" --notes "상품관리 화면 정리·제외항목 기본 숨김, 재고 확인 부분실패·사유 표시, 정확한 SKU 재고 연결 보완" --latest
          mkdir verify
          gh release download v1.1.18 --pattern AliCoupangManagerSetup-v1.1.18.zip --dir verify
          echo "b5e3cf3b89744dcf0c0d84bb2cfadf89a9601b5ada9dab3d9a31272a71d4da6d  verify/AliCoupangManagerSetup-v1.1.18.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.18',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.18/AliCoupangManagerSetup-v1.1.18.zip',sha256='b5e3cf3b89744dcf0c0d84bb2cfadf89a9601b5ada9dab3d9a31272a71d4da6d',notes='상품관리 화면 정리·제외항목 기본 숨김, 재고 확인 부분실패·사유 표시, 정확한 SKU 재고 연결 보완')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.18 automatic update"
          git push
