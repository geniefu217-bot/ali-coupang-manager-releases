name: Publish v1.1.28
on:
  push:
    paths:
      - '.github/workflows/publish-v1128.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-52d8-81f8-839f-aebb04cbe8a1/raw?se=2026-10-18T07%3A39%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=3d6cab94-8da3-4302-a244-859ac24e8b4c&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T23%3A57%3A00Z&ske=2026-10-18T23%3A57%3A00Z&sks=b&skv=2026-02-06&sig=vsIfR%2BpdFWrqOv/jos/tXNdyT50kgFnGRjh8XcSeaR8%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.28.zip
          echo "fd7b7c5928b5b7348b9db3a94e5516ce8124e9c61c02d598cd451def24ace2a2  AliCoupangManagerSetup-v1.1.28.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.28.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.28 AliCoupangManagerSetup-v1.1.28.zip --title "알리 쿠팡 매니저 v1.1.28" --notes "쿠팡 등록 재시도 차단 시 원래 오류 표시, 수집 상품 수신 후 목록 자동 갱신 및 탭 전환 시 최신 조회, 편집 중인 값 보호" --latest
          mkdir verify
          gh release download v1.1.28 --pattern AliCoupangManagerSetup-v1.1.28.zip --dir verify
          echo "fd7b7c5928b5b7348b9db3a94e5516ce8124e9c61c02d598cd451def24ace2a2  verify/AliCoupangManagerSetup-v1.1.28.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.28',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.28/AliCoupangManagerSetup-v1.1.28.zip',sha256='fd7b7c5928b5b7348b9db3a94e5516ce8124e9c61c02d598cd451def24ace2a2',notes='쿠팡 등록 재시도 차단 시 원래 오류 표시, 수집 상품 수신 후 목록 자동 갱신 및 탭 전환 시 최신 조회, 편집 중인 값 보호')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.28 automatic update"
          git push
