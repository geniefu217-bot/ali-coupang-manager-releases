name: Publish v1.1.21
on:
  push:
    paths:
      - '.github/workflows/publish-v1121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-8494-8209-af08-b22b1ecd6808/raw?se=2026-10-17T12%3A47%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=d3c98772-9647-4cef-b53b-78be777e00cd&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T01%3A20%3A51Z&ske=2026-10-18T01%3A20%3A51Z&sks=b&skv=2026-02-06&sig=t9eIRJXyQkD5/nLhkWhmxjT9z%2B1se3CdIVDyd4lxlY4%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.21.zip
          echo "1fb8464ddbdaecf787f7b617179114d06d87227a40c77c35313b96a27375e3db  AliCoupangManagerSetup-v1.1.21.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.21.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.21 AliCoupangManagerSetup-v1.1.21.zip --title "알리 쿠팡 매니저 v1.1.21" --notes "50상품씩 자동전송·이어수집, 수집상품 중복·필수값 자동검사 후 등록, 등록일 필터·최신순 정렬, 상품관리 상단 통합, 옵션 확인 시간초과 및 원화가격 인식 보완" --latest
          mkdir verify
          gh release download v1.1.21 --pattern AliCoupangManagerSetup-v1.1.21.zip --dir verify
          echo "1fb8464ddbdaecf787f7b617179114d06d87227a40c77c35313b96a27375e3db  verify/AliCoupangManagerSetup-v1.1.21.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.21',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.21/AliCoupangManagerSetup-v1.1.21.zip',sha256='1fb8464ddbdaecf787f7b617179114d06d87227a40c77c35313b96a27375e3db',notes='50상품씩 자동전송·이어수집, 수집상품 중복·필수값 자동검사 후 등록, 등록일 필터·최신순 정렬, 상품관리 상단 통합, 옵션 확인 시간초과 및 원화가격 인식 보완')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.21 automatic update"
          git push
