name: Publish v1.1.31
on:
  push:
    paths: ['.github/workflows/publish-v1131.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        run: |
          echo "27a0e85b2a4f9e3b41f2c540bf9f50c174f5362b372bef85ef5508cfaab0385c  AliCoupangManagerSetup-v1.1.31.zip" | sha256sum -c -
          echo "7832792dcffb021dfc5b49720a336304d47b739bc0682be7ff48d6ef1fb7747b  AliNailtipCollector-v2.3.20.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.31.zip
          unzip -t AliNailtipCollector-v2.3.20.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.31 AliCoupangManagerSetup-v1.1.31.zip AliNailtipCollector-v2.3.20.zip --title "알리 쿠팡 매니저 v1.1.31" --notes "Windows 자동업데이트 종료·설치·재실행 순서 보완, 설치 실패 로그 및 실제 실행 버전 확인" --latest
      - name: Verify public downloads
        run: |
          mkdir verify
          curl --fail --location --retry 3 --max-time 180 'https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.31/AliCoupangManagerSetup-v1.1.31.zip' -o verify/AliCoupangManagerSetup-v1.1.31.zip
          echo "27a0e85b2a4f9e3b41f2c540bf9f50c174f5362b372bef85ef5508cfaab0385c  verify/AliCoupangManagerSetup-v1.1.31.zip" | sha256sum -c -
          curl --fail --location --retry 3 --max-time 180 'https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.31/AliNailtipCollector-v2.3.20.zip' -o verify/AliNailtipCollector-v2.3.20.zip
          echo "7832792dcffb021dfc5b49720a336304d47b739bc0682be7ff48d6ef1fb7747b  verify/AliNailtipCollector-v2.3.20.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.31',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.31/AliCoupangManagerSetup-v1.1.31.zip',sha256='27a0e85b2a4f9e3b41f2c540bf9f50c174f5362b372bef85ef5508cfaab0385c',notes='Windows 자동업데이트 종료·설치·재실행 순서 보완, 설치 실패 로그 및 실제 실행 버전 확인')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.31 automatic update"
          git push
