name: Publish v1.1.13
on:
  push:
    paths:
      - '.github/workflows/publish-v1113.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-6154-81f8-8b55-25898b6c71ff/raw?se=2026-10-17T10%3A44%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=65a9e043-4068-4749-bc5e-d500fcba6c69&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T23%3A32%3A44Z&ske=2026-10-17T23%3A32%3A44Z&sks=b&skv=2026-02-06&sig=7totEptduk5fMcX7MiMIwPdt772D56AWNRZ5WvNVZgY%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.13.zip
          echo "889476809d091982f9a3c8b4f80d4b971e0072a88b0893771725cfa73e6c3337  AliCoupangManagerSetup-v1.1.13.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.13.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.13 AliCoupangManagerSetup-v1.1.13.zip --title "알리 쿠팡 매니저 v1.1.13" --notes "등록 상품 재고 자동분산 확인, 삭제 페이지 연결상품 정리, 운송장 등록·상태 갱신, 수집 일시정지·이어하기 및 속도 개선" --latest
          mkdir verify
          gh release download v1.1.13 --pattern AliCoupangManagerSetup-v1.1.13.zip --dir verify
          echo "889476809d091982f9a3c8b4f80d4b971e0072a88b0893771725cfa73e6c3337  verify/AliCoupangManagerSetup-v1.1.13.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.13',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.13/AliCoupangManagerSetup-v1.1.13.zip',sha256='889476809d091982f9a3c8b4f80d4b971e0072a88b0893771725cfa73e6c3337',notes='등록 상품 재고 자동분산 확인, 삭제 페이지 연결상품 정리, 운송장 등록·상태 갱신, 수집 일시정지·이어하기 및 속도 개선')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.13 automatic update"
          git push
