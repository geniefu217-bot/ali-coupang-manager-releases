name: Publish v1.1.26
on:
  push:
    paths:
      - '.github/workflows/publish-v1126.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-90d0-8209-b3e4-3da02f894e27/raw?se=2026-10-18T00%3A33%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=435ac70a-f3d0-4517-882f-550643cc38ae&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T23%3A29%3A16Z&ske=2026-10-18T23%3A29%3A16Z&sks=b&skv=2026-02-06&sig=hudVBhwgxqgImvjap6xhwzIG%2B1ssmETM2KhKeSRnNTY%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.26.zip
          echo "367037a0fd20027e9900bf970a5b2568c4ce884e047442f4c9cb6ca7f2049c56  AliCoupangManagerSetup-v1.1.26.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.26.zip
      - name: Prepare verified collector 2.3.17
        env:
          COLLECTOR_ZIP: ""
        run: |
          python - <<'PY'
          import os,base64,hashlib,zipfile,json
          from pathlib import Path
          p=Path('AliNailtipCollector-v2.3.17.zip')
          p.write_bytes(base64.b64decode(os.environ['COLLECTOR_ZIP']))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9b3e5bf1aef52b41a050a5b590401a2fec27841682f58692fcd26df80d3dc751'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert json.loads(z.read('ali-nailtip-collector-2.3.17/manifest.json'))['version']=='2.3.17'
          PY
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.26 AliCoupangManagerSetup-v1.1.26.zip AliNailtipCollector-v2.3.17.zip --title "알리 쿠팡 매니저 v1.1.26" --notes "상세 수집 전 전체 상품번호 중복 검사·이어하기 갱신, 보류 승인·품절 처리·제거, 재고 미확인과 품절 구분" --latest
          mkdir verify
          gh release download v1.1.26 --pattern AliCoupangManagerSetup-v1.1.26.zip --dir verify
          echo "367037a0fd20027e9900bf970a5b2568c4ce884e047442f4c9cb6ca7f2049c56  verify/AliCoupangManagerSetup-v1.1.26.zip" | sha256sum -c -
          gh release download v1.1.26 --pattern AliNailtipCollector-v2.3.17.zip --dir verify
          echo "9b3e5bf1aef52b41a050a5b590401a2fec27841682f58692fcd26df80d3dc751  verify/AliNailtipCollector-v2.3.17.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.26',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.26/AliCoupangManagerSetup-v1.1.26.zip',sha256='367037a0fd20027e9900bf970a5b2568c4ce884e047442f4c9cb6ca7f2049c56',notes='상세 수집 전 전체 상품번호 중복 검사·이어하기 갱신, 보류 승인·품절 처리·제거, 재고 미확인과 품절 구분')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.26 automatic update"
          git push
