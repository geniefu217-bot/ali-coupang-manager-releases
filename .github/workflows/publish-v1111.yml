name: Publish v1.1.11
on:
  push:
    paths:
      - '.github/workflows/publish-v1111.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-7888-8209-a8e6-ac6fa41866f2/raw?se=2026-10-17T09%3A48%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=d5d6435d-4e10-4bd9-99b6-043e2d86c140&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T00%3A53%3A03Z&ske=2026-10-18T00%3A53%3A03Z&sks=b&skv=2026-02-06&sig=vImyZUk3KNG/SvTtBWRQ0b4PQJCDuM1NCxYV6IKsdTI%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.11.zip
          echo "a23eadb1af7452143829f369c1b356ad9c862d17f3a7f7a3ae0aa0c1c18abde7  AliCoupangManagerSetup-v1.1.11.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.11.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.11 AliCoupangManagerSetup-v1.1.11.zip --title "알리 쿠팡 매니저 v1.1.11" --notes "상품 ID 중복 검사 후 상세 확인, 초이스·알뜰마트 판정 및 수집 진단 개선, 상품 도구 한 줄 정리, 미사용 알리 API 메뉴 숨김" --latest
          mkdir verify
          gh release download v1.1.11 --pattern AliCoupangManagerSetup-v1.1.11.zip --dir verify
          echo "a23eadb1af7452143829f369c1b356ad9c862d17f3a7f7a3ae0aa0c1c18abde7  verify/AliCoupangManagerSetup-v1.1.11.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.11',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.11/AliCoupangManagerSetup-v1.1.11.zip',sha256='a23eadb1af7452143829f369c1b356ad9c862d17f3a7f7a3ae0aa0c1c18abde7',notes='상품 ID 중복 검사 후 상세 확인, 초이스·알뜰마트 판정 및 수집 진단 개선, 상품 도구 한 줄 정리, 미사용 알리 API 메뉴 숨김')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.11 automatic update"
          git push
