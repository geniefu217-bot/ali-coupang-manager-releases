name: Publish v1.1.10
on:
  push:
    paths:
      - '.github/workflows/publish-v1110.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-543c-8211-98fb-a51aa792e06c/raw?se=2026-10-17T09%3A28%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=c04ae52f-714c-40a6-a1fe-b240afcf2036&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T00%3A53%3A04Z&ske=2026-10-18T00%3A53%3A04Z&sks=b&skv=2026-02-06&sig=t8GWnBenG/NXq4Voy1pZmuzcNT/h9GJ3Y6lqLO8E2YQ%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.10.zip
          echo "760e89704ea3c620aecd0a36da06ed937b979216a8846d556f9e176deeb60265  AliCoupangManagerSetup-v1.1.10.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.10.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.10 AliCoupangManagerSetup-v1.1.10.zip --title "알리 쿠팡 매니저 v1.1.10" --notes "상품 표시·선택 개수, 목표 수량까지 다음 페이지 연속 수집, 신규 등록 판매 시작일 당일 설정" --latest
          mkdir verify
          gh release download v1.1.10 --pattern AliCoupangManagerSetup-v1.1.10.zip --dir verify
          echo "760e89704ea3c620aecd0a36da06ed937b979216a8846d556f9e176deeb60265  verify/AliCoupangManagerSetup-v1.1.10.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.10',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.10/AliCoupangManagerSetup-v1.1.10.zip',sha256='760e89704ea3c620aecd0a36da06ed937b979216a8846d556f9e176deeb60265',notes='상품 표시·선택 개수, 목표 수량까지 다음 페이지 연속 수집, 신규 등록 판매 시작일 당일 설정')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.10 automatic update"
          git push
