name: Publish v1.1.25
on:
  push:
    paths:
      - '.github/workflows/publish-v1125.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-e5f4-8209-80dc-3e4826512688/raw?se=2026-10-18T00%3A28%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=435ac70a-f3d0-4517-882f-550643cc38ae&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T22%3A58%3A53Z&ske=2026-10-18T22%3A58%3A53Z&sks=b&skv=2026-02-06&sig=YFBoZVMyc5wHphJNYdbWgkXNWKlaemyztY/NL6G4hKo%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.25.zip
          echo "52d0621c51eb5f11d3a1b8e6d27163b49422f41084c0ebf552b426c86940ca9a  AliCoupangManagerSetup-v1.1.25.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.25.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.25 AliCoupangManagerSetup-v1.1.25.zip --title "알리 쿠팡 매니저 v1.1.25" --notes "보류 상품 직접 승인·품절 처리·제거와 복원, 네일팁 분류 보완, 재고 미확인과 품절 0 구분" --latest
          mkdir verify
          gh release download v1.1.25 --pattern AliCoupangManagerSetup-v1.1.25.zip --dir verify
          echo "52d0621c51eb5f11d3a1b8e6d27163b49422f41084c0ebf552b426c86940ca9a  verify/AliCoupangManagerSetup-v1.1.25.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.25',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.25/AliCoupangManagerSetup-v1.1.25.zip',sha256='52d0621c51eb5f11d3a1b8e6d27163b49422f41084c0ebf552b426c86940ca9a',notes='보류 상품 직접 승인·품절 처리·제거와 복원, 네일팁 분류 보완, 재고 미확인과 품절 0 구분')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.25 automatic update"
          git push
