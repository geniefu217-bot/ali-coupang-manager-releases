name: Publish v1.1.12
on:
  push:
    paths:
      - '.github/workflows/publish-v1112.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-8a44-8209-b5a6-da2b20c60ec6/raw?se=2026-10-17T10%3A04%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=d26bef01-05c7-4921-8de7-80c5e4e3a511&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T01%3A08%3A04Z&ske=2026-10-18T01%3A08%3A04Z&sks=b&skv=2026-02-06&sig=qnimK03eXfHYsKm1pw65WT/h70fQgDw1JAyTXihYXKc%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.12.zip
          echo "b556b5ebc11ff40a959404228a1584142101e375f94935625a4a92e7b35cd286  AliCoupangManagerSetup-v1.1.12.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.12.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.12 AliCoupangManagerSetup-v1.1.12.zip --title "알리 쿠팡 매니저 v1.1.12" --notes "옵션별 재고 직접 확인, 주문 수집 진행률 및 신규·반품·취소·교환 건수 표시" --latest
          mkdir verify
          gh release download v1.1.12 --pattern AliCoupangManagerSetup-v1.1.12.zip --dir verify
          echo "b556b5ebc11ff40a959404228a1584142101e375f94935625a4a92e7b35cd286  verify/AliCoupangManagerSetup-v1.1.12.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.12',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.12/AliCoupangManagerSetup-v1.1.12.zip',sha256='b556b5ebc11ff40a959404228a1584142101e375f94935625a4a92e7b35cd286',notes='옵션별 재고 직접 확인, 주문 수집 진행률 및 신규·반품·취소·교환 건수 표시')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.12 automatic update"
          git push
