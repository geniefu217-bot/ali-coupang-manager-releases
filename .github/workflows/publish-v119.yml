name: Publish v1.1.9
on:
  push:
    paths:
      - '.github/workflows/publish-v119.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-5a60-8209-9531-c20950bb5b65/raw?se=2026-10-17T09%3A05%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=fa6e762d-66c8-47dd-aa5f-028b999b9050&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T23%3A59%3A39Z&ske=2026-10-17T23%3A59%3A39Z&sks=b&skv=2026-02-06&sig=ylBRuSzkhAWIj0yIG1RzSvJYvngpDzuM7FPW3ugPOhc%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.9.zip
          echo "317f26d26598902afc861520130a3aa420bf0797a7a0d38ea4c48382aae2bd2f  AliCoupangManagerSetup-v1.1.9.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.9.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.9 AliCoupangManagerSetup-v1.1.9.zip --title "알리 쿠팡 매니저 v1.1.9" --notes "작업현황 개별·전체 중단, 재고 확인 수집기 중단 연결 및 처리 결과 보존" --latest
          mkdir verify
          gh release download v1.1.9 --pattern AliCoupangManagerSetup-v1.1.9.zip --dir verify
          echo "317f26d26598902afc861520130a3aa420bf0797a7a0d38ea4c48382aae2bd2f  verify/AliCoupangManagerSetup-v1.1.9.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.9',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.9/AliCoupangManagerSetup-v1.1.9.zip',sha256='317f26d26598902afc861520130a3aa420bf0797a7a0d38ea4c48382aae2bd2f',notes='작업현황 개별·전체 중단, 재고 확인 수집기 중단 연결 및 처리 결과 보존')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.9 automatic update"
          git push
