name: Publish v1.1.8
on:
  push:
    paths:
      - '.github/workflows/publish-v118.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1c94-8209-af07-af20f3aa70b5/raw?se=2026-10-17T08%3A49%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=af0ed946-b7f4-48ce-a536-c99f6cd8faad&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T01%3A07%3A57Z&ske=2026-10-18T01%3A07%3A57Z&sks=b&skv=2026-02-06&sig=Vm6k/HJbgePECcvIEvQSqa7EHLhP4G9QSZbTZYCsRrM%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.8.zip
          echo "8e38eece24398dafd3485782d67b6c2d1f26701e37ea07a892868f573216827e  AliCoupangManagerSetup-v1.1.8.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.8.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.8 AliCoupangManagerSetup-v1.1.8.zip --title "알리 쿠팡 매니저 v1.1.8" --notes "초이스만 수집·알뜰마트 제외, 이미지 복구·전체 선택, API 요청 제한 대응, 주문관리 축소·기본 7일" --latest
          mkdir verify
          gh release download v1.1.8 --pattern AliCoupangManagerSetup-v1.1.8.zip --dir verify
          echo "8e38eece24398dafd3485782d67b6c2d1f26701e37ea07a892868f573216827e  verify/AliCoupangManagerSetup-v1.1.8.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.8',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.8/AliCoupangManagerSetup-v1.1.8.zip',sha256='8e38eece24398dafd3485782d67b6c2d1f26701e37ea07a892868f573216827e',notes='초이스만 수집·알뜰마트 제외, 이미지 복구·전체 선택, API 요청 제한 대응, 주문관리 축소·기본 7일')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.8 automatic update"
          git push
