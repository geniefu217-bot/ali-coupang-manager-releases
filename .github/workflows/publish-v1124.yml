name: Publish v1.1.24
on:
  push:
    paths:
      - '.github/workflows/publish-v1124.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-e964-8209-840d-79b9ecc40181/raw?se=2026-10-18T00%3A00%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=7be56c24-1e83-431f-ad43-16c75f8cc77d&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T22%3A58%3A08Z&ske=2026-10-18T22%3A58%3A08Z&sks=b&skv=2026-02-06&sig=JNqYJK7JrQIM8NlA45DKIWmvFBaSqPjgh42IznBtzmk%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.24.zip
          echo "806671de51cd7ac27da322a46722bdb0a492662f5fb242446226acb8b6607615  AliCoupangManagerSetup-v1.1.24.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.24.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.24 AliCoupangManagerSetup-v1.1.24.zip --title "알리 쿠팡 매니저 v1.1.24" --notes "옵션 화면 반복 탐색·비교와 대상 조회 계산 최적화, 빠르게 로딩된 탭의 완료 신호 누락으로 생기는 대기 보완" --latest
          mkdir verify
          gh release download v1.1.24 --pattern AliCoupangManagerSetup-v1.1.24.zip --dir verify
          echo "806671de51cd7ac27da322a46722bdb0a492662f5fb242446226acb8b6607615  verify/AliCoupangManagerSetup-v1.1.24.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.24',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.24/AliCoupangManagerSetup-v1.1.24.zip',sha256='806671de51cd7ac27da322a46722bdb0a492662f5fb242446226acb8b6607615',notes='옵션 화면 반복 탐색·비교와 대상 조회 계산 최적화, 빠르게 로딩된 탭의 완료 신호 누락으로 생기는 대기 보완')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.24 automatic update"
          git push
