name: Publish v1.1.30
on:
  push:
    paths: ['.github/workflows/publish-v1130.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        run: |
          echo "21680ed158c4204ae25aecdeaf64c0d2c71a0c4d2010c04702d098e68cf09f1f  AliCoupangManagerSetup-v1.1.30.zip" | sha256sum -c -
          echo "7832792dcffb021dfc5b49720a336304d47b739bc0682be7ff48d6ef1fb7747b  AliNailtipCollector-v2.3.20.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.30.zip
          unzip -t AliNailtipCollector-v2.3.20.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.30 AliCoupangManagerSetup-v1.1.30.zip AliNailtipCollector-v2.3.20.zip --title "알리 쿠팡 매니저 v1.1.30" --notes "등록상품의 미등록 옵션 필터, 선택 옵션 재고 일괄 저장, Ctrl+F 화면 검색 및 접힌 옵션 자동 펼침" --latest
      - name: Verify public downloads
        run: |
          mkdir verify
          curl --fail --location --retry 3 --max-time 180 'https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.30/AliCoupangManagerSetup-v1.1.30.zip' -o verify/AliCoupangManagerSetup-v1.1.30.zip
          echo "21680ed158c4204ae25aecdeaf64c0d2c71a0c4d2010c04702d098e68cf09f1f  verify/AliCoupangManagerSetup-v1.1.30.zip" | sha256sum -c -
          curl --fail --location --retry 3 --max-time 180 'https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.30/AliNailtipCollector-v2.3.20.zip' -o verify/AliNailtipCollector-v2.3.20.zip
          echo "7832792dcffb021dfc5b49720a336304d47b739bc0682be7ff48d6ef1fb7747b  verify/AliNailtipCollector-v2.3.20.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.30',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.30/AliCoupangManagerSetup-v1.1.30.zip',sha256='21680ed158c4204ae25aecdeaf64c0d2c71a0c4d2010c04702d098e68cf09f1f',notes='등록상품의 미등록 옵션 필터, 선택 옵션 재고 일괄 저장, Ctrl+F 화면 검색 및 접힌 옵션 자동 펼침')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.30 automatic update"
          git push
