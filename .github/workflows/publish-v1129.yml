name: Publish v1.1.29
on:
  push:
    paths:
      - '.github/workflows/publish-v1129.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final Windows build
        run: |
          echo "c2998956001622c04b4f5eaddc4691539590084d79ca1f47701273d50b98c95e  AliCoupangManagerSetup-v1.1.29.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.29.zip
      - name: Prepare and verify collector 2.3.19
        env:
          COLLECTOR_ZIP: ""
        run: |
          python - <<'PY'
          import base64,os,hashlib,zipfile,json
          from pathlib import Path
          p=Path('AliNailtipCollector-v2.3.19.zip')
          p.write_bytes(base64.b64decode(os.environ['COLLECTOR_ZIP']))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='46b843abfff3ef01d57befcdfaa0a06c927ee6a0fae5dff23287ce84a902535c'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert json.loads(z.read('ali-nailtip-collector/manifest.json'))['version']=='2.3.19'
          PY
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.29 AliCoupangManagerSetup-v1.1.29.zip AliNailtipCollector-v2.3.19.zip --title "알리 쿠팡 매니저 v1.1.29" --notes "수집 대기 개선·50상품 또는 5분마다 중간 전송, 보류 상품 카테고리 선택 및 카테고리별 등록 검수, 상품 목록에서 알리 원본 바로 열기" --latest
          mkdir verify
          curl --fail --location --retry 3 --max-time 180 'https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.29/AliCoupangManagerSetup-v1.1.29.zip' -o verify/AliCoupangManagerSetup-v1.1.29.zip
          echo "c2998956001622c04b4f5eaddc4691539590084d79ca1f47701273d50b98c95e  verify/AliCoupangManagerSetup-v1.1.29.zip" | sha256sum -c -
          curl --fail --location --retry 3 --max-time 180 'https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.29/AliNailtipCollector-v2.3.19.zip' -o verify/AliNailtipCollector-v2.3.19.zip
          echo "46b843abfff3ef01d57befcdfaa0a06c927ee6a0fae5dff23287ce84a902535c  verify/AliNailtipCollector-v2.3.19.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.29',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.29/AliCoupangManagerSetup-v1.1.29.zip',sha256='c2998956001622c04b4f5eaddc4691539590084d79ca1f47701273d50b98c95e',notes='수집 대기 개선·50상품 또는 5분마다 중간 전송, 보류 상품 카테고리 선택 및 카테고리별 등록 검수, 상품 목록에서 알리 원본 바로 열기')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.29 automatic update"
          git push
