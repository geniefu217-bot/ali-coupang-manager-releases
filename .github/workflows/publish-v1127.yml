name: Publish v1.1.27
on:
  push:
    paths:
      - '.github/workflows/publish-v1127.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0460-8209-90b5-1efe0e4210c0/raw?se=2026-10-18T01%3A44%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=df295c87-d5bc-4946-849f-0a88521fc99c&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-18T00%3A49%3A15Z&ske=2026-10-19T00%3A49%3A15Z&sks=b&skv=2026-02-06&sig=UEEOl1WcsSKxeAFKtOJe5iXHKpOeQf/mI/802pFH1%2B0%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.27.zip
          echo "dff94495e439189d3246113a682f0dbe2325e8c7b2df6c5f5ff9214c49518599  AliCoupangManagerSetup-v1.1.27.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.27.zip
      - name: Prepare verified collector 2.3.18
        env:
          COLLECTOR_ZIP: ""
        run: |
          python - <<'PY'
          import os,base64,hashlib,zipfile,json
          from pathlib import Path
          p=Path('AliNailtipCollector-v2.3.18.zip')
          p.write_bytes(base64.b64decode(os.environ['COLLECTOR_ZIP']))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='75573325bc9e820788a01b1b34c1848dceccc55307e5f1c1ce0e180bb0f354e5'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert json.loads(z.read('ali-nailtip-collector/manifest.json'))['version']=='2.3.18'
          PY
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.27 AliCoupangManagerSetup-v1.1.27.zip AliNailtipCollector-v2.3.18.zip --title "알리 쿠팡 매니저 v1.1.27" --notes "수집 전용 창 분리·고유 탭 번호 제어, 탭 조작 충돌 재시도, 상세 응답 연결 복구와 실패 상품 이어하기" --latest
          mkdir verify
          gh release download v1.1.27 --pattern AliCoupangManagerSetup-v1.1.27.zip --dir verify
          echo "dff94495e439189d3246113a682f0dbe2325e8c7b2df6c5f5ff9214c49518599  verify/AliCoupangManagerSetup-v1.1.27.zip" | sha256sum -c -
          gh release download v1.1.27 --pattern AliNailtipCollector-v2.3.18.zip --dir verify
          echo "75573325bc9e820788a01b1b34c1848dceccc55307e5f1c1ce0e180bb0f354e5  verify/AliNailtipCollector-v2.3.18.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.27',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.27/AliCoupangManagerSetup-v1.1.27.zip',sha256='dff94495e439189d3246113a682f0dbe2325e8c7b2df6c5f5ff9214c49518599',notes='수집 전용 창 분리·고유 탭 번호 제어, 탭 조작 충돌 재시도, 상세 응답 연결 복구와 실패 상품 이어하기')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.27 automatic update"
          git push
