name: Publish v1.1.7
on:
  push:
    paths:
      - '.github/workflows/publish-v117.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-2758-8209-b3b1-60254043dd78/raw?se=2026-10-17T08%3A28%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=75c2fb9b-2e13-4ae6-933b-0944f6f055b3&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T07%3A03%3A57Z&ske=2026-10-18T07%3A03%3A57Z&sks=b&skv=2026-02-06&sig=Hhh1KQqpgTp/lzGlVlBvuzKm8IMNRbCMcCDTgcH7fkI%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.7.zip
          echo "48c16d2b02cd96a3b5fa6afa183a45341e939062e9c2fb122ee5c89a376fb01a  AliCoupangManagerSetup-v1.1.7.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.7.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.7 AliCoupangManagerSetup-v1.1.7.zip --title "알리 쿠팡 매니저 v1.1.7" --notes "상품·주문관리 UI 개편, 재고·이미지 재수집, 작업현황·실패 상세, 메모 기록, 월별·연간 수익" --latest
          mkdir verify
          gh release download v1.1.7 --pattern AliCoupangManagerSetup-v1.1.7.zip --dir verify
          echo "48c16d2b02cd96a3b5fa6afa183a45341e939062e9c2fb122ee5c89a376fb01a  verify/AliCoupangManagerSetup-v1.1.7.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.7',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.7/AliCoupangManagerSetup-v1.1.7.zip',sha256='48c16d2b02cd96a3b5fa6afa183a45341e939062e9c2fb122ee5c89a376fb01a',notes='상품·주문관리 UI 개편, 재고·이미지 재수집, 작업현황·실패 상세, 메모 기록, 월별·연간 수익')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.7 automatic update"
          git push
