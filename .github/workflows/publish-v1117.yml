name: Publish v1.1.17
on:
  push:
    paths:
      - '.github/workflows/publish-v1117.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-c160-8209-8780-8b186ac14712/raw?se=2026-10-17T11%3A49%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=e6f73a8f-fcd4-466c-84d4-fe78d909909e&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T00%3A29%3A53Z&ske=2026-10-18T00%3A29%3A53Z&sks=b&skv=2026-02-06&sig=sfPDjtFdeZa6/E/A9cHzbBWlf6T6FPaRRWAFbf15swo%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.17.zip
          echo "b4eabf1c2cb1183518150929e4102d57644bd031e01247d54b71135dbba4c7ef  AliCoupangManagerSetup-v1.1.17.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.17.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.17 AliCoupangManagerSetup-v1.1.17.zip --title "알리 쿠팡 매니저 v1.1.17" --notes "판매 수량 1개 자동 입력, 옵션별 수집 재고를 실제 판매 가능 재고로 등록" --latest
          mkdir verify
          gh release download v1.1.17 --pattern AliCoupangManagerSetup-v1.1.17.zip --dir verify
          echo "b4eabf1c2cb1183518150929e4102d57644bd031e01247d54b71135dbba4c7ef  verify/AliCoupangManagerSetup-v1.1.17.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.17',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.17/AliCoupangManagerSetup-v1.1.17.zip',sha256='b4eabf1c2cb1183518150929e4102d57644bd031e01247d54b71135dbba4c7ef',notes='판매 수량 1개 자동 입력, 옵션별 수집 재고를 실제 판매 가능 재고로 등록')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.17 automatic update"
          git push
