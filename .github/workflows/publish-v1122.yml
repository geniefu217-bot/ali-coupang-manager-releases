name: Publish v1.1.22
on:
  push:
    paths:
      - '.github/workflows/publish-v1122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-eafc-8209-8732-285bff5a00ca/raw?se=2026-10-17T23%3A24%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=ee756898-eb0e-4451-8026-abe9e22d717d&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-17T19%3A44%3A47Z&ske=2026-10-18T19%3A44%3A47Z&sks=b&skv=2026-02-06&sig=my5fo/q3t1JFfBmL2YgUA9DTsL7ME2scP/QqtCNbfZg%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.22.zip
          echo "af6b27332b1a0e2434e3d76788161f9c2cc283e1c96697514074820a0973355b  AliCoupangManagerSetup-v1.1.22.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.22.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.22 AliCoupangManagerSetup-v1.1.22.zip --title "알리 쿠팡 매니저 v1.1.22" --notes "선택 옵션 표시가격·품절 인식 보완, 확인값 중간 저장과 부분 완료 표시, 미확인 항목만 재시도, 최초 수집 품절옵션 제외·등록옵션 품절 시 재고0 반영" --latest
          mkdir verify
          gh release download v1.1.22 --pattern AliCoupangManagerSetup-v1.1.22.zip --dir verify
          echo "af6b27332b1a0e2434e3d76788161f9c2cc283e1c96697514074820a0973355b  verify/AliCoupangManagerSetup-v1.1.22.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.22',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.22/AliCoupangManagerSetup-v1.1.22.zip',sha256='af6b27332b1a0e2434e3d76788161f9c2cc283e1c96697514074820a0973355b',notes='선택 옵션 표시가격·품절 인식 보완, 확인값 중간 저장과 부분 완료 표시, 미확인 항목만 재시도, 최초 수집 품절옵션 제외·등록옵션 품절 시 재고0 반영')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.22 automatic update"
          git push
