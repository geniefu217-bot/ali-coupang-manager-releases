name: Publish v1.1.15
on:
  push:
    paths:
      - '.github/workflows/publish-v1115.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify final Windows build
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-c198-8211-8ba9-9073b193b1bf/raw?se=2026-10-17T11%3A27%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=c8df0e5f-2994-4df9-b092-36f56f5ad275&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T20%3A43%3A30Z&ske=2026-10-17T20%3A43%3A30Z&sks=b&skv=2026-02-06&sig=4HPtdjRjgCfW/vzFGskA/9uapkHt9Zmh27TALI%2BzrUE%3D"
        run: |
          curl --fail --location --retry 3 --max-time 180 "$ARTIFACT_URL" -o AliCoupangManagerSetup-v1.1.15.zip
          echo "a5b3ee69b82c9be474fbe670776e16e9408078dac5681beb11299518629333b6  AliCoupangManagerSetup-v1.1.15.zip" | sha256sum -c -
          unzip -t AliCoupangManagerSetup-v1.1.15.zip
      - name: Publish release and verify asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.15 AliCoupangManagerSetup-v1.1.15.zip --title "알리 쿠팡 매니저 v1.1.15" --notes "상품별 묶음·옵션 펼치기, 쿠팡 필수옵션 검수와 조건미달 업로드 차단, 전송 후 수집 이어가기" --latest
          mkdir verify
          gh release download v1.1.15 --pattern AliCoupangManagerSetup-v1.1.15.zip --dir verify
          echo "a5b3ee69b82c9be474fbe670776e16e9408078dac5681beb11299518629333b6  verify/AliCoupangManagerSetup-v1.1.15.zip" | sha256sum -c -
      - name: Activate verified automatic update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          d=json.loads(p.read_text(encoding='utf-8-sig'))
          d.update(version='1.1.15',download_url='https://github.com/geniefu217-bot/ali-coupang-manager-releases/releases/download/v1.1.15/AliCoupangManagerSetup-v1.1.15.zip',sha256='a5b3ee69b82c9be474fbe670776e16e9408078dac5681beb11299518629333b6',notes='상품별 묶음·옵션 펼치기, 쿠팡 필수옵션 검수와 조건미달 업로드 차단, 전송 후 수집 이어가기')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Activate verified v1.1.15 automatic update"
          git push
